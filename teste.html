<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Weather — Previsão do Tempo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .web-container {
            width: 100%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Lado Esquerdo: Conteúdo Principal */
        .main-content {
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header-search {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-bar {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 320px;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
            width: 100%;
        }

        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .current-weather {
            margin: 2rem 0;
        }

        .location {
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .temp-display {
            font-size: 6rem;
            font-weight: 300;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .condition {
            font-size: 1.2rem;
            color: #94a3b8;
            font-weight: 400;
        }

        /* Previsão por Hora */
        .hourly-section h3, .details-section h3 {
            font-size: 1rem;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 1rem;
        }

        .hourly-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
        }

        .hour-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 16px;
            text-align: center;
            transition: transform 0.2s;
        }

        .hour-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.07);
        }

        .hour-card span {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .hour-card i {
            margin: 0.75rem 0;
            font-size: 1.2rem;
            color: #38bdf8;
        }

        .hour-card strong {
            font-size: 1rem;
            font-weight: 500;
        }

        /* Lado Direito: Detalhes e Métricas */
        .sidebar-details {
            background: rgba(0, 0, 0, 0.15);
            padding: 3rem;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .detail-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.25rem;
            border-radius: 20px;
        }

        .detail-card .title {
            font-size: 0.85rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .detail-card .value {
            font-size: 1.5rem;
            font-weight: 500;
        }

        @media(max-width: 900px) {
            .web-container {
                grid-template-columns: 1fr;
            }
            .sidebar-details {
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.05);
            }
        }
    </style>
</head>
<body>

    <div class="web-container">
        <!-- Esquerda -->
        <div class="main-content">
            <div class="header-search">
                <div class="logo"><strong>Aura</strong>.weather</div>
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass" style="color: rgba(255,255,255,0.4)"></i>
                    <input type="text" placeholder="Buscar cidade...">
                </div>
            </div>

            <div class="current-weather">
                <div class="location"><i class="fa-solid fa-location-dot" style="font-size: 1.2rem; color: #38bdf8; margin-right: 8px;"></i> São Paulo, Brasil</div>
                <div class="temp-display">22°</div>
                <div class="condition">Parcialmente Nublado</div>
            </div>

            <div class="hourly-section">
                <h3>Previsão para as próximas horas</h3>
                <div class="hourly-grid">
                    <div class="hour-card">
                        <span>Agora</span>
                        <i class="fa-solid fa-cloud-sun"></i>
                        <strong>22°</strong>
                    </div>
                    <div class="hour-card">
                        <span>15:00</span>
                        <i class="fa-solid fa-sun"></i>
                        <strong>24°</strong>
                    </div>
                    <div class="hour-card">
                        <span>18:00</span>
                        <i class="fa-solid fa-cloud-sun"></i>
                        <strong>20°</strong>
                    </div>
                    <div class="hour-card">
                        <span>21:00</span>
                        <i class="fa-solid fa-moon"></i>
                        <strong>18°</strong>
                    </div>
                    <div class="hour-card">
                        <span>00:00</span>
                        <i class="fa-solid fa-cloud-moon"></i>
                        <strong>17°</strong>
                    </div>
                </div>
            </div>
        </div>

        <!-- Direita: Métricas -->
        <div class="sidebar-details">
            <h3>Detalhes Climáticos</h3>
            
            <div class="detail-card">
                <div class="title"><i class="fa-solid fa-wind"></i> Vento</div>
                <div class="value">12 <span style="font-size: 1rem; color: #94a3b8;">km/h</span></div>
            </div>

            <div class="detail-card">
                <div class="title"><i class="fa-solid fa-droplet"></i> Umidade do Ar</div>
                <div class="value">68%</div>
            </div>

            <div class="detail-card">
                <div class="title"><i class="fa-solid fa-sun"></i> Índice UV</div>
                <div class="value">4 <span style="font-size: 1rem; color: #38bdf8;">Moderado</span></div>
            </div>

            <div class="detail-card">
                <div class="title"><i class="fa-solid fa-gauge"></i> Pressão Atmosférica</div>
                <div class="value">1013 <span style="font-size: 1rem; color: #94a3b8;">hPa</span></div>
            </div>
        </div>
    </div>

</body>
</html>
