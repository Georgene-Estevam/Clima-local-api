<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/img/Copilot_20250815_181831.png" type="image/x-icon">
    <title>Clima Local</title>

    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/responsive.css">

    <!--Link Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>

<header>
    <div class="container">
        <img class="logo" src="./assets/img/atmospheric-conditions.png" alt="Imagem da logo do site clima local">
        <p>Clima local</p>
    </div><!--.container-->
</header>

<!--==========================Início section.consultar-clima========================-->
<section class="consultar-clima">
    <div class="banner">
        <div class="search-container">
            <input type="search" id="cidade" placeholder="Consulte o clima de sua cidade">
            <div class="container-autocomplete-list">
                <div id="autocomplete-list" class="autocomplete-list"></div>
            </div>
            <button onclick="buscarClima()">Buscar</button>
        </div><!--.autocomplete-container-->
    </div><!--.banner-->

    <div class="container">
        <div class="cards-contents">
            <h2>
                <span id="local"></span>
                <span id="regiao"></span>
                <span id="pais"></span>

                <div id="resultado"></div>
            </h2>

            <div class="info-cards">
                <header class="info-cards-titulo">
                    <p>Temperatura: </p>
                    <img src="./assets/img/temperature.png" alt="Ícone de temperatura">
                </header>

                <div class="resposta-consulta">
                    <div class="dados-consulta-wrapper">
                        <span id="resultado-Temp-Celsius"></span>
                        <span id="resultado-Temp-Fahrenheit"></span>
                    </div>
                </div>
            </div><!--.info-cards-->

            <div class="info-cards">
                <header class="info-cards-titulo">
                    <p>Clima: </p>
                    <span id="conditionIcon"></span>
                </header>
                
                <div class="resposta-consulta">
                    <span id="condition"></span>
                </div>
            </div><!--.info-cards-->

            <div class="info-cards">
                <header class="info-cards-titulo">
                    <p>Velocidade do vento: </p>
                    <img src="./assets/img/speed wind.png" alt="Ícone de velocidade do vento" class="speed-wind"> 
                </header>
                
                <div class="resposta-consulta">
                    <div class="dados-consulta-wrapper">
                        <span id="velocidade-Vento-Kmh"></span>
                        <span id="velocidade-Vento-Mph"></span>
                    </div>

                    <div class="dados-direcao-vento-wrapper">
                        <span id="grau-Do-Vento"></span>
                        <span id="direcao-Vento"></span>
                    </div>
                </div>
            </div><!--.info-cards-->

            <!--<p>Temperatura em fahrenheit: <span id="fahrenheit"></span></p>-->
            
            <div class="info-cards">
                <header class="info-cards-titulo">
                    <p>Umidade do ar: </p>
                    <img class="humidity-icon" src="./assets/img/humidity.png" alt="Ícone de umidade do ar">
                </header>
                
                <div class="resposta-consulta">
                    <span id="umidade"></span>
            </div><!--.info-cards-->
        </div><!--.cards-contents-->

    </div><!--.container-->
</section>
<!--==========================Fim section.consultar-clima========================-->

<!--==========================Início do Footer========================-->
<footer>
    
<div class="container">
        <p>Desenvolvido com suporte da API:<a href="https://www.weatherapi.com/" title="Free Weather API" target="_blank"> WeatherAPI.com</a></p>

        <!--<a href="https://www.weatherapi.com/" title="Free Weather API" target="_blank"><img src='//cdn.weatherapi.com/v4/images/weatherapi_logo.png' alt="Weather data by WeatherAPI.com" border="0"></a>-->


        <div class="clear"></div>
</div><!--.container-->
</footer>
  <!--==========================Fim do Footer========================-->

  <script defer src="consulta.js"></script>
  <script defer src="./searchCity.js"></script>
</body>
</html>
